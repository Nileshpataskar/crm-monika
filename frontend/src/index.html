<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Siddhivinayak CRM</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Only the icons we use are downloaded (icon_names must be in alphabetical order). -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..24,400,0..1,0&icon_names=ac_unit,account_balance,add,brightness_auto,calendar_month,calendar_today,check,check_circle,chevron_right,close,cloud_upload,dark_mode,dashboard,delete,description,download,edit,engineering,error,fact_check,folder_open,grid_on,group,hourglass_top,info,inventory_2,key,light_mode,local_shipping,lock,logout,menu,payments,pending_actions,person,receipt_long,request_quote,schedule,search,sync,table_view,task_alt,upload,upload_file,view_column,visibility,visibility_off,warning&display=block"
      rel="stylesheet"
    />
    <script>
      // Apply the saved light/dark choice before anything is drawn (see core/theme.ts).
      (function () {
        try {
          var choice = localStorage.getItem('crm_theme') || 'system';
          var dark = choice === 'dark' || (choice === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root>
      <!-- Shown until Angular starts (it replaces everything inside app-root). Plain CSS: Tailwind
           classes work too, but this must look right even before the stylesheet has loaded. -->
      <div class="splash">
        <div class="splash-logo">SE</div>
        <div class="splash-spinner"></div>
        <div class="splash-text">Loading Siddhivinayak CRM…</div>
        <div class="splash-slow">Waking up the server. After a quiet spell this takes a few seconds.</div>
      </div>
    </app-root>
  </body>
</html>
